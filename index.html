<!DOCTYPE html>

    <style>

        /* CONTAINER FOR FULL DESKTOP SPREAD */
        .wrapper-full { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 40px; }

        nav { position: sticky; top: 0; z-index: 100; background-color: rgba(3, 7, 18, 0.95); border-bottom: 1px solid #1f2937; padding: 20px 0; width: 100%; backdrop-filter: blur(10px); }

        /* HERO SECTION - MASSIVE DISPLAY */

        .hero-p { font-size: 20px; color: #9ca3af; margin-bottom: 40px; max-width: 700px; }
        
        /* HERO BUTTONS */
        .hero-buttons { display: flex; gap: 20px; }
        @media (max-width: 1024px) { .hero-buttons { justify-content: center; } }

        .btn-secondary { display: inline-block; border: 1px solid #374151; color: #ffffff; padding: 18px 36px; border-radius: 14px; font-size: 16px; font-weight: 800; text-decoration: none; text-align: center; transition: 0.2s; }
        .btn-secondary:hover { border-color: #10b981; color: #10b981; }

        .hero-img-container { width: 100%; display: flex; justify-content: center; justify-self: center; }
        .hero-img-frame { width: 100%; max-width: 450px; border-radius: 32px; border: 2px solid #1f2937; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }

        .metric-card h3 { font-size: 42px; font-weight: 900; color: #10b981; margin-bottom: 6px; }
        .metric-card p { font-size: 13px; color: #9ca3af; text-transform: uppercase; tracking: 1px; font-weight: 600; }
        
        /* GENERAL SECTIONS ROW GRID SETUP */
        .section-py { padding: 120px 0; width: 100%; }
        .section-title { text-align: center; margin-bottom: 80px; }
        .section-title h2 { font-size: 42px; font-weight: 800; margin-bottom: 20px; color: #ffffff; tracking: -0.02em; }
        .section-title p { color: #9ca3af; font-size: 18px; max-width: 700px; margin: 0 auto; }
        
        /* SERVICES */

        @media (max-width: 900px) { .services-grid { grid-template-columns: 1fr; } }

        .card h3 { font-size: 22px; font-weight: 700; margin-bottom: 16px; color: #ffffff; }
        .card p { color: #9ca3af; font-size: 15px; }
        
        /* NICHES */

        @media (max-width: 768px) { .niche-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .review-img-box img { width: 100%; height: auto; border-radius: 14px; display: block; object-fit: contain; }
        
        /* FAQ */
        .faq-container { max-width: 850px; margin: 0 auto; width: 100%; text-align: left; }

        .faq-item p { color: #9ca3af; font-size: 15px; }

        .contact-info-row a { color: #10b981; text-decoration: underline; }
        
        .contact-box { background-color: #0b0f19; border: 1px solid #1f2937; padding: 48px; border-radius: 28px; text-align: center; width: 100%; display: flex; flex-direction: column; justify-content: center; }
        .contact-box h3 { font-size: 24px; font-weight: 700; color: #ffffff; margin-bottom: 12px; }
        .contact-box p { color: #9ca3af; font-size: 15px; margin-bottom: 32px; }
        .btn-wa-full { display: block; background-color: #10b981; color: #030712; padding: 18px; border-radius: 14px; font-weight: 800; text-decoration: none; font-size: 16px; transition: 0.2s; }
